---
layout: base.html
---
<div style="max-width: 800px;">
    {% for post in collections.blog %}
    <div class="skill-category" style="margin-bottom: 20px;">
        <a href="{{ post.url }}" style="color: var(--accent-primary); text-decoration: none;">
            <div class="job-title">{{ post.data.title }}</div>
        </a>
        <div class="date" style="text-align: left; margin-top: 5px;">
            {{ post.date | date: "%B %d, %Y" }} 
        </div>
        {% if post.data.description %}
        <p class="details-text" style="margin-top: 10px;">{{ post.data.description }}</p>
        {% endif %}
    </div>
    {% endfor %}
</div>
